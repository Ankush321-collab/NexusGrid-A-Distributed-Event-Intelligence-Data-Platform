services:
  # ============================================================================
  # 1. BACKING INFRASTRUCTURE SERVICES
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: nexusgrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusgrid}
      POSTGRES_USER: ${POSTGRES_USER:-nexusgrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusgrid_secure_pwd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/auth-service/migrations:/docker-entrypoint-initdb.d/01-auth:ro
      - ./apps/alert-service/migrations:/docker-entrypoint-initdb.d/02-alert:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexusgrid} -d ${POSTGRES_DB:-nexusgrid}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexusgrid-net

  redis:
    image: redis:7.2-alpine
    container_name: nexusgrid-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nexusgrid-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nexusgrid-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks:
      - nexusgrid-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: nexusgrid-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./infra/compose/clickhouse-init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - nexusgrid-net

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: nexusgrid-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_secure_pwd}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - nexusgrid-net

  # ============================================================================
  # 2. NEXUSGRID MICROSERVICES & WORKERS
  # ============================================================================
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: nexusgrid-auth-service
    restart: unless-stopped
    ports:
      - "${PORT_AUTH:-8081}:8081"
    env_file:
      - .env
    environment:
      PORT: ${PORT_AUTH:-8081}
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexusgrid-net

  ingestion-service:
    build:
      context: .
      dockerfile: apps/ingestion-service/Dockerfile
    container_name: nexusgrid-ingestion-service
    restart: unless-stopped
    ports:
      - "${PORT_INGESTION:-8080}:8080"
    env_file:
      - .env
    environment:
      PORT: ${PORT_INGESTION:-8080}
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:29092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - nexusgrid-net

  query-service:
    build:
      context: .
      dockerfile: apps/query-service/Dockerfile
    container_name: nexusgrid-query-service
    restart: unless-stopped
    ports:
      - "${PORT_QUERY:-8083}:8083"
    env_file:
      - .env
    environment:
      PORT: ${PORT_QUERY:-8083}
      REDIS_HOST: redis
      CLICKHOUSE_HOST: http://clickhouse:8123
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_started
    networks:
      - nexusgrid-net

  alert-service:
    build:
      context: .
      dockerfile: apps/alert-service/Dockerfile
    container_name: nexusgrid-alert-service
    restart: unless-stopped
    ports:
      - "${PORT_ALERT:-8084}:8084"
    env_file:
      - .env
    environment:
      PORT: ${PORT_ALERT:-8084}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CLICKHOUSE_HOST: http://clickhouse:8123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_started
    networks:
      - nexusgrid-net

  event-processor:
    build:
      context: .
      dockerfile: workers/event-processor/Dockerfile
    container_name: nexusgrid-event-processor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: kafka:29092
      CLICKHOUSE_HOST: http://clickhouse:8123
      MINIO_ENDPOINT: minio
    depends_on:
      kafka:
        condition: service_started
      clickhouse:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - nexusgrid-net

  outbox-publisher:
    build:
      context: .
      dockerfile: workers/outbox-publisher/Dockerfile
    container_name: nexusgrid-outbox-publisher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - nexusgrid-net

networks:
  nexusgrid-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  kafkadata:
  chdata:
  miniodata:
